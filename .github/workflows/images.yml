# Generated by the development repository's publishing tooling from the
# project's declared images. Edit them there; a change made only here is
# overwritten by the next publish.
#
# Every push to main builds the images for linux/amd64 and linux/arm64 and
# pushes them to the GitHub Container Registry (ghcr.io).
name: Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mcp-server-find:
    name: mcp-server-find
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/geoffmyers/mcp-server-find
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=mcp-server-find
            org.opencontainers.image.licenses=GPL-3.0-or-later
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            SERVER=find-mcp-server
            PACKAGES=findutils openssh-client
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mcp-server-find
          cache-to: type=gha,mode=max,scope=mcp-server-find

